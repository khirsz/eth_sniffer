# Mirroring configuration read by /etc/init.d/S41swmirror at boot.

# yes = enable mirroring at system startup
MIRROR_ENABLE=yes

# Monitor port: connect the laptop running Wireshark here.
MIRROR_TO=lan4

# Source ports, comma separated: lan1..lan4, cpu
MIRROR_FROM=lan1

# Direction: rx (traffic received on the port), tx (sent), both
MIRROR_DIR=both
