# Konfiguracja mirroringu wczytywana przez /etc/init.d/S41swmirror przy starcie.

# yes = włącz mirroring przy starcie systemu
MIRROR_ENABLE=yes

# Port monitorujący: tu podłączasz laptopa z Wiresharkiem.
MIRROR_TO=lan4

# Porty źródłowe, oddzielone przecinkami: lan1..lan4, cpu
MIRROR_FROM=lan1

# Kierunek: rx (ruch odbierany na porcie), tx (wysyłany), both
MIRROR_DIR=both
