# Switch configuration read by /etc/init.d/S38swmirror at boot.
#
# Default layout (passive tap):
#   LAN1  configuration port: SSH + DHCP, talks only to the router CPU
#   LAN2  capture port: laptop running Wireshark, gets a copy of LAN4 traffic
#   LAN3  far side of the tapped link
#   LAN4  device under observation
# LAN4 <-> LAN3 is switched in hardware like a plain cable; the router CPU
# and LAN1 are isolated from that segment.
#
# Port names: lan1..lan4 (labels on the case), cpu (the router CPU).

# --- Port-based VLAN (page 0x31) ---
# yes = apply the PVLAN_* masks below at boot
PVLAN_ENABLE=yes

# PVLAN_<port> = where frames RECEIVED on <port> may be forwarded to:
# a comma separated list of ports, "none" or "all" (the reset default).
PVLAN_LAN1=cpu
PVLAN_LAN2=none
PVLAN_LAN3=lan4
PVLAN_LAN4=lan3
PVLAN_CPU=lan1

# --- Port mirroring (page 0x02) ---
# yes = enable mirroring at system startup
MIRROR_ENABLE=yes

# Monitor (capture) port: connect the laptop running Wireshark here.
# The switch supports exactly one capture port.
MIRROR_TO=lan2

# Source ports, comma separated: lan1..lan4, cpu
MIRROR_FROM=lan4

# Direction: rx (traffic received on the port), tx (sent), both
MIRROR_DIR=both
