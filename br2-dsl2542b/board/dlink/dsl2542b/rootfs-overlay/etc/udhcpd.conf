# BusyBox udhcpd: hands out addresses to the laptop on LAN1.
# The switch port isolation (/etc/swmirror.conf) lets the CPU talk only to
# LAN1, so DHCP never reaches LAN2-LAN4 even though it listens on eth0.

interface	eth0
start		192.168.15.100
end		192.168.15.150
max_leases	16
option	subnet	255.255.255.0
option	lease	86400

# No "option router" and no "option dns": the laptop must keep its default
# route (e.g. Wi-Fi to the internet); it only needs to reach 192.168.15.1.

lease_file	/var/lib/misc/udhcpd.leases
pidfile		/var/run/udhcpd.pid
